# YOLOv7 (Wang, Bochkovskiy, Liao, 2022) - Darknet cfg by the paper authors
# Source: https://github.com/AlexeyAB/darknet/blob/master/cfg/yolov7.cfg
# [Unified] changes (everything else is the original file):
#   - [net] width/height 640 -> 608 (common input size)
#   - activation=logistic -> linear on the 3 head convolutions
#     (the shared v3 YOLO layers apply the sigmoid themselves)
#   - [yolo] keys scale_x_y / new_coords / iou_loss / nms_kind are ignored by the shared layers
#   - classes / head filters are patched at build time (common.darknet.patch_head)
#   - anchors: KITTI BEV anchors of the v3 / v4 complex cfg
[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=8
subdivisions=1
# [Unified] original: 640
width=608
# [Unified] original: 640
height=608
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation = 1.5
exposure = 1.5
hue=.1

learning_rate=0.00261
burn_in=1000

max_batches = 2000200
policy=steps
steps=1600000,1800000
scales=.1,.1

